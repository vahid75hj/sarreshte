<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سررشته</title>
<style>@font-face{font-family:Vazirmatn;src:url(client/fonts/Vazirmatn-Regular.woff2) format("woff2");font-weight:400}@font-face{font-family:Vazirmatn;src:url(client/fonts/Vazirmatn-Bold.woff2) format("woff2");font-weight:700}@font-face{font-family:Vazirmatn;src:url(client/fonts/Vazirmatn-ExtraBold.woff2) format("woff2");font-weight:800}
