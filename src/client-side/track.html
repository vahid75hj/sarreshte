<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پیگیری سفارش · سررشته</title><link rel="stylesheet" href="style.css"></head><body><main>
<header class="top"><div class="logo">ن</div><div><h1>پیگیری سفارش</h1><p class="sub">شمع نورا</p></div></header>
<div id="box"><div class="card">در حال بارگذاری…</div></div>
<p class="muted" style="text-align:center;margin-top:16px">این لینک را نگه دارید؛ دیگر لازم نیست برای پرسیدن وضعیت سفارش پیام بدهید.</p>
<script src="seed.js"></script><script src="common.js"></script><script>
function copyText(t,b){const done=()=>{const o=b.textContent;b.textContent='کپی شد ✓';setTimeout(()=>b.textContent=o,1500)};
 const fb=()=>{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,99999);try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,fb)}else fb()}
const code = new URLSearchParams(location.search).get("c");
const label = { pending_payment: 'منتظر پرداخت', awaiting_confirm: 'منتظر تأیید واریز', paid: 'پرداخت تأیید شد', shipped: 'ارسال شد', cancelled: 'لغو شد' };
api('/api/public/orders/' + code).then(o => {
  const lvl = { pending_payment: 1, awaiting_confirm: 1, paid: 2, shipped: 3 }[o.status] || 0;
  const at = s => (o.history.find(h => h.status === s) || {}).at;
  const steps = [
    ['ثبت سفارش', faDate(o.createdAt), lvl >= 1],
    [o.status === 'pending_payment' ? 'منتظر پرداخت' : o.status === 'awaiting_confirm' ? 'رسید رسید؛ منتظر تأیید فروشنده' : 'پرداخت تأیید شد', o.payment ? faDate(o.payment.at) : 'هنوز پرداخت نشده', lvl >= 2],
    ['ارسال با پست', o.postalCode ? 'کد رهگیری ثبت شد' : (o.status === 'paid' ? 'در حال آماده‌سازی؛ بعد از ارسال، کد رهگیری مرسوله اینجا نمایش داده می‌شود' : 'بعد از تأیید پرداخت'), lvl >= 3]];
  const cur = steps.findIndex(s => !s[2]);
  const pc = o.status === 'shipped' || o.status === 'paid' ? 'pos' : o.status === 'cancelled' ? 'neg' : '';
  $('#box').innerHTML = `
   <div class="card"><div class="row" style="padding:0"><div><div class="muted">سفارش ${o.code}</div><div style="font-weight:800;font-size:18px">${o.name}</div></div><span class="pill ${pc}">${label[o.status]}</span></div></div>
   ${o.status === 'cancelled' ? '<div class="note" style="color:var(--neg);margin-bottom:12px">این سفارش لغو شده است.</div>' : `
   <div class="card"><ul class="tl">${steps.map(([t, d, done], i) => `<li class="${done ? 'done' : i === cur ? 'cur' : ''}"><span class="dot">${done ? '✓' : fa(i + 1)}</span><div class="t">${t}</div><div class="d">${d}</div></li>`).join('')}</ul></div>`}
   ${o.postalCode ? `<div class="card"><div class="muted">کد رهگیری پست</div><div class="row" style="padding:4px 0 0"><span class="track-code">${o.postalCode}</span><button class="copy" onclick="copyText('${o.postalCode}',this)">کپی کد</button><a href="https://tracking.post.ir/?id=${o.postalCode}" target="_blank">پیگیری در سایت پست ←</a></div></div>` : ''}
   <div class="card"><div class="muted">لینک پیگیری این سفارش</div><div class="row" style="padding:6px 0 0;gap:8px"><span class="track-code" style="font-size:12px;direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${location.href}</span><button class="copy" onclick="copyText(location.href,this)">کپی لینک</button></div></div>
   <div class="sec">جزئیات سفارش</div>
   <div class="card" style="padding:10px 16px">${o.items.map(i => `<div class="row"><span>${fa(i.qty)} × ${i.name}</span><span>${toman(i.price * i.qty)}</span></div>`).join('')}
    <hr><div class="row"><b>جمع</b><b>${toman(o.total)}</b></div><div class="row"><span class="k">ارسال به</span><span style="text-align:left">${o.address}</span></div></div>`;
}).catch(e => $('#box').innerHTML = `<div class="card">${e.message}</div>`);
</script></main></body></html>
